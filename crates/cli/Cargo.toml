[package]
name = "wasma-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Wasma CLI — primary interface for build, verify, test, run and publish."

[lib]
name = "wasma_cli"
path = "src/lib.rs"

[[bin]]
name = "wasma"
path = "src/main.rs"

[[bin]]
name = "agent-native"
path = "src/bin/agent_native_alias.rs"
required-features = ["legacy-alias"]

[features]
default = []
legacy-alias = []

[lints]
workspace = true

[dependencies]
wasma-ir = { path = "../ir", version = "0.1.0" }
wasma-compiler = { path = "../compiler", version = "0.1.0" }
wasma-runtime = { path = "../runtime", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
minisign-verify = "0.2"
ureq = { version = "2.10", features = ["json"] }

[dev-dependencies]
flate2 = "1.0"
tar = "0.4"
minisign = "0.7"
wasm-encoder = "0.221"
