[package]
name = "agent-native"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Agent-Native CLI — primary interface for build, verify, test, run and publish."

[lib]
name = "agent_native"
path = "src/lib.rs"

[[bin]]
name = "agent-native"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
agent-native-ir = { path = "../ir" }
agent-native-compiler = { path = "../compiler" }
agent-native-runtime = { path = "../runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
sha2 = "0.10"

