[package]
name = "wasma-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Standalone runtime that loads and executes Wasma WASM components."

[lints]
workspace = true

[features]
# Host-side workers remain opt-in until AN-066 and AN-067 validate isolation
# and operational behavior across supported platforms.
experimental-workers = []

[dependencies]
wasma-ir = { path = "../ir", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml2 = "0.1"
sha2 = "0.10"
thiserror = "2.0"
wasmtime = { version = "29.0.1", default-features = false, features = [
    "cranelift",
    "runtime",
    "component-model",
    "std",
] }
# INIT-07-01 (AN-044): WASI Preview 2 host. Pinned exactly (churn risk R-05) and
# confined to this crate (ADR-002). `preview1` is not needed.
wasmtime-wasi = { version = "=29.0.1", default-features = false }
bytes = "1"

[dev-dependencies]
# Compiler used only to produce WASM artifacts for smoke tests. ADR-002
# forbids this dependency in [dependencies]; dev-dependencies do not reach
# downstream consumers of wasma-runtime.
wasma-compiler = { path = "../compiler", version = "0.1.0" }
criterion = "0.5"
wasm-encoder = "=0.221.3"
# WASI fixtures (AN-044): minimal Component Model artifacts that import exact
# `wasi:*` interface versions. Dev-only; pinned for Rust 1.85 compatibility (AC-S5).
wat = "=1.221.3"
wit-component = "0.219.2"
wit-parser = "0.219.2"

[[bench]]
name = "baseline"
harness = false

[[bench]]
name = "extended"
harness = false

[[bench]]
name = "wasi_diagnostic"
harness = false

[[example]]
name = "worker_bench"
required-features = ["experimental-workers"]
