suite: an-020-isolation
spec_version: 1
host_stubs:
  - interface: host
    operation: kv_get
    kind: state_reader
    key_arg: 0
cases:
  - id: isolation-case-A-populated
    requirement: ISO-001
    function: read_key
    args: [1]
    host_state:
      kv:
        1: 777
    expected: 777
    expected_host_calls:
      - import: host.kv_get
        args: [1]
  - id: isolation-case-B-same-kv-populated
    requirement: ISO-002
    function: read_key
    args: [1]
    host_state:
      kv:
        1: 42
    expected: 42
    expected_host_calls:
      - import: host.kv_get
        args: [1]
