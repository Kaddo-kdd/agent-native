suite: an-020-kv-read
spec_version: 1
host_stubs:
  - interface: host
    operation: kv_get
    kind: state_reader
    key_arg: 0
cases:
  - id: read-existing-key
    requirement: KV-READ-001
    function: read_key
    args: [42]
    host_state:
      kv:
        42: 1337
    expected: 1337
    expected_host_calls:
      - import: host.kv_get
        args: [42]
  - id: read-another-existing-key
    requirement: KV-READ-003
    function: read_key
    args: [7]
    host_state:
      kv:
        7: -5
    expected: -5
    expected_host_calls:
      - import: host.kv_get
        args: [7]
  - id: read-with-short-import-name
    requirement: KV-READ-004
    function: read_key
    args: [11]
    host_state:
      kv:
        11: 42
    expected: 42
    expected_host_calls:
      - import: kv_get
        args: [11]
