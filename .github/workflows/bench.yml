name: Benchmarks Cross-OS

# Manual only (AN-052): never blocks PRs. Results are uploaded as artifacts and
# feed INIT-08-02. See knowledge/tech/baselines/benchmark-methodology.md.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Full suite, narrow WASI confirmation, AN-062 diagnostic, or AN-067 workers A/A
        required: true
        default: full
        type: choice
        options:
          - full
          - wasi-confirmation
          - wasi-diagnostic
          - workers-aa
          - workers-smoke
          - workers-soak

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    if: inputs.scope != 'workers-aa' && inputs.scope != 'workers-smoke' && inputs.scope != 'workers-soak'
    name: Bench (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain (per rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: bench-${{ matrix.os }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify collection and aggregation
        run: python -m unittest discover -s scripts -p "test_bench_*.py" -v

      - name: Verify individual latency percentile method
        run: cargo test --locked -p wasma-runtime --example bench_latency

      - name: Three full repetitions on this runner
        run: python scripts/bench_collect.py --scope "${{ inputs.scope }}"

      - name: Show technical results in job summary
        if: always()
        run: python scripts/bench_summary.py bench-results

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: bench-results/
          if-no-files-found: error
          retention-days: 30

  worker-bench:
    if: inputs.scope == 'workers-aa' || inputs.scope == 'workers-smoke' || inputs.scope == 'workers-soak'
    name: Worker A/A benchmark (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain (per rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: worker-bench-linux

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify worker benchmark collector
        run: python -m unittest scripts/test_worker_bench_collect.py -v

      - name: Build worker benchmark
        run: cargo build --locked --release -p wasma-runtime --features experimental-workers --example worker_bench

      - name: Collect worker A/A sessions
        shell: bash
        run: |
          if [ "${{ inputs.scope }}" = "workers-smoke" ]; then
            repetitions=1; warmup=50; requests=500
            workload_args=""
          elif [ "${{ inputs.scope }}" = "workers-soak" ]; then
            repetitions=1; warmup=1000; requests=10000
            workload_args="--workloads sum --soak-seconds 900 --soak-raw-every 100"
          else
            repetitions=3; warmup=1000; requests=10000
            workload_args=""
          fi
          python scripts/worker_bench_collect.py --output worker-bench-results \
            --benchmark-bin target/release/examples/worker_bench \
            --session-timeout-seconds 600 \
            --workers 2 --queue-capacities 4 --concurrency 4 \
            --repetitions "$repetitions" --warmup "$warmup" --requests "$requests" $workload_args
      - name: Upload worker benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-bench-${{ github.run_id }}-${{ github.run_attempt }}
          path: worker-bench-results/
          if-no-files-found: error
          retention-days: 30
