name: Release Multi-Platform

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Release mode: "validation" (dry-run with test keys) or "official" (requires authentic project keys)'
        required: true
        type: choice
        options:
          - validation
          - official
        default: validation
      confirm_publish:
        description: 'Set to true ONLY if Decisión D3 is formally lifted and you intend to publish an official release'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

# Restringir permisos por defecto al mínimo privilegio (ADR-004)
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: agent-native
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: agent-native.exe
            archive_ext: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: agent-native
            archive_ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build CLI release binary
        run: cargo build --release -p agent-native --bin agent-native --target ${{ matrix.target }}

      - name: Determine Version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VER="${GITHUB_REF#refs/tags/}"
          else
            VER="v0.0.0-dev"
          fi
          echo "tag=${VER}" >> "$GITHUB_OUTPUT"

      - name: Install GNU tar (macOS)
        if: runner.os == 'macOS'
        run: brew install gnu-tar

      - name: Validate Binary Architecture & Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          TARGET="${{ matrix.target }}"
          STAGE_DIR="agent-native-${TAG}-${TARGET}"
          mkdir -p "${STAGE_DIR}"

          BIN_PATH="target/${TARGET}/release/${{ matrix.binary_name }}"
          test -f "${BIN_PATH}" || { echo "ERROR: Binary not found at ${BIN_PATH}"; exit 1; }

          # Validar arquitectura real para macOS (Apple Silicon arm64)
          if [[ "${TARGET}" == "aarch64-apple-darwin" ]]; then
            file "${BIN_PATH}" | grep -E -i "(arm64|aarch64)" || {
              echo "ERROR: Target declares aarch64-apple-darwin but binary is not arm64" >&2
              file "${BIN_PATH}" >&2
              exit 1
            }
          fi

          # Strip de símbolos sin ignorar fallos silenciosamente
          strip "${BIN_PATH}"

          # Comprobar inclusión estricta de artefactos conforme a ADR-006
          cp "${BIN_PATH}" "${STAGE_DIR}/"
          cp LICENSE README.md "${STAGE_DIR}/"

          # Normalizar permisos y timestamps para reproducibilidad
          chmod 755 "${STAGE_DIR}/${{ matrix.binary_name }}"
          chmod 644 "${STAGE_DIR}/LICENSE" "${STAGE_DIR}/README.md"
          touch -d "2026-01-01 00:00:00 UTC" "${STAGE_DIR}"/* 2>/dev/null || touch -t 202601010000.00 "${STAGE_DIR}"/*

          # Seleccionar binario tar compatible con GNU tar (gtar en macOS via brew, tar en Linux)
          if command -v gtar >/dev/null 2>&1; then
            TAR_BIN="gtar"
          else
            TAR_BIN="tar"
          fi

          ARCHIVE_NAME="${STAGE_DIR}.${{ matrix.archive_ext }}"
          # Empaquetar con orden determinista, timestamp fijo y propietarios neutrales
          ${TAR_BIN} --sort=name --mtime="2026-01-01 00:00:00Z" --owner=0 --group=0 --numeric-owner -czvf "${ARCHIVE_NAME}" -C "${STAGE_DIR}" .
          echo "Created archive: ${ARCHIVE_NAME}"

          # Verificar contenido interno exacto del paquete y permisos
          echo "Verifying archive contents:"
          ${TAR_BIN} -tvf "${ARCHIVE_NAME}"

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Tag = "${{ steps.version.outputs.tag }}"
          $Target = "${{ matrix.target }}"
          $StageDir = "agent-native-$Tag-$Target"
          New-Item -ItemType Directory -Path $StageDir | Out-Null

          $BinPath = "target\$Target\release\${{ matrix.binary_name }}"
          if (-not (Test-Path $BinPath)) { throw "Binary not found at $BinPath" }

          Copy-Item $BinPath -Destination $StageDir
          Copy-Item LICENSE, README.md -Destination $StageDir

          # Normalizar fechas de modificación para reproducibilidad de metadatos
          Get-ChildItem -Path $StageDir | ForEach-Object {
              $_.CreationTime = "2026-01-01 00:00:00"
              $_.LastWriteTime = "2026-01-01 00:00:00"
          }

          $ArchiveName = "$StageDir.zip"
          Compress-Archive -Path "$StageDir\*" -DestinationPath $ArchiveName
          Write-Host "Created archive: $ArchiveName"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: agent-native-*.*
          if-no-files-found: error
          retention-days: 7

  validate-and-sign:
    name: Checksums, Minisign & Integrity Validation
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Generate and sort SHA256SUMS manifest
        run: |
          cd dist
          ls -la
          # Generar catálogo SHA-256 determinista ordenado por nombre de archivo
          sha256sum agent-native-* | LC_ALL=C sort -k 2 > SHA256SUMS
          echo "=== SHA256SUMS Catalog ==="
          cat SHA256SUMS

      - name: Verify SHA256 checksums of packaged archives
        run: |
          cd dist
          sha256sum -c SHA256SUMS

      - name: Install Minisign
        run: |
          sudo apt-get update && sudo apt-get install -y minisign

      - name: Execute Minisign Verification (Validation Mode vs Official Mode)
        env:
          INPUT_MODE: ${{ github.event.inputs.mode || 'validation' }}
          MINISIGN_SECRET_KEY: ${{ secrets.RELEASE_MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.RELEASE_MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          cd dist

          if [ "${INPUT_MODE}" = "official" ]; then
            echo "=== EXECUTING OFFICIAL SIGNING MODE ==="

            # 1. Verificar si la clave pública sigue siendo un placeholder (bloqueante)
            if grep -q "PLACEHOLDER" ../knowledge/tech/release-signing-key.pub; then
              echo "ERROR: Official signing is BLOCKED because knowledge/tech/release-signing-key.pub is still a placeholder." >&2
              echo "A human maintainer must provision an authentic Minisign keypair before official mode can proceed." >&2
              exit 1
            fi

            # 2. Verificar que los secretos requeridos existan
            if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
              echo "ERROR: Official signing requires RELEASE_MINISIGN_SECRET_KEY secret." >&2
              exit 1
            fi

            # 3. Guardar clave privada en directorio temporal seguro con permisos 700/600 y trap de limpieza
            SECURE_KEY_DIR=$(mktemp -d)
            chmod 700 "${SECURE_KEY_DIR}"
            trap 'shred -u "${SECURE_KEY_DIR}/minisign.key" 2>/dev/null || rm -f "${SECURE_KEY_DIR}/minisign.key"; rm -rf "${SECURE_KEY_DIR}"' EXIT

            set +x
            echo "${MINISIGN_SECRET_KEY}" > "${SECURE_KEY_DIR}/minisign.key"
            chmod 600 "${SECURE_KEY_DIR}/minisign.key"

            echo "Signing SHA256SUMS with official release key..."
            if [ -n "${MINISIGN_PASSWORD:-}" ]; then
              echo "${MINISIGN_PASSWORD}" | minisign -S -s "${SECURE_KEY_DIR}/minisign.key" -m SHA256SUMS -t "agent-native release ${{ github.ref_name }}"
            else
              minisign -S -s "${SECURE_KEY_DIR}/minisign.key" -m SHA256SUMS -t "agent-native release ${{ github.ref_name }}" -W
            fi

            echo "Verifying official signature against repository public key..."
            minisign -Vm SHA256SUMS -p ../knowledge/tech/release-signing-key.pub
            echo "✓ Official Minisign signature verified successfully!"

          else
            echo "=== EXECUTING VALIDATION (DRY-RUN) MODE ==="
            echo "Generating ephemeral test Minisign keypair for end-to-end cryptographic verification..."

            EPHEMERAL_DIR=$(mktemp -d)
            chmod 700 "${EPHEMERAL_DIR}"
            trap 'shred -u "${EPHEMERAL_DIR}/test.key" 2>/dev/null || rm -f "${EPHEMERAL_DIR}/test.key"; rm -rf "${EPHEMERAL_DIR}"' EXIT

            # Generar par de claves efímero de prueba
            minisign -G -p "${EPHEMERAL_DIR}/test-minisign.pub" -s "${EPHEMERAL_DIR}/test.key" -W

            # Firmar catálogo como artefacto de prueba explícito
            minisign -S -s "${EPHEMERAL_DIR}/test.key" -m SHA256SUMS -x SHA256SUMS.test-minisig -t "agent-native TEST DRY-RUN signature (NOT FOR OFFICIAL DISTRIBUTION)"

            # Verificar firma con la clave pública de prueba
            minisign -Vm SHA256SUMS -p "${EPHEMERAL_DIR}/test-minisign.pub" -x SHA256SUMS.test-minisig

            # Copiar la clave pública de prueba para auditoría del bundle de validación
            cp "${EPHEMERAL_DIR}/test-minisign.pub" ./test-minisign.pub

            echo "================================================================================"
            echo "✓ DRY-RUN VALIDATION SUCCESSFUL: Packages, SHA256SUMS, and Minisign verified."
            echo "NOTICE: Signature generated with ephemeral test key (SHA256SUMS.test-minisig)."
            echo "NOT FOR OFFICIAL PRODUCTION DISTRIBUTION (Decisión D3 activa)."
            echo "================================================================================"
          fi

      - name: Upload validated release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: dist/*
          retention-days: 14

  # Job de publicación: estrictamente segregado y desactivado en cumplimiento de Decisión D3
  publish:
    name: Publish GitHub Release (Guarded by D3)
    needs: validate-and-sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # PROTECCIÓN D3: La publicación formal permanece congelada hasta decisión humana explícita.
    # En el futuro, se requerirá environment con aprobadores (Environment: production) y confirmación explícita.
    if: false
    steps:
      - name: Download bundle
        uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: true
          prerelease: false
