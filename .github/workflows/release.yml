name: Release Multi-Platform

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo de ejecución: "validation" (dry-run seguro con clave efímera) u "official" (firma oficial Minisign)'
        required: true
        default: 'validation'
        type: choice
        options:
          - validation
          - official
      confirm_publish:
        description: 'Confirmación explícita de publicación para modo oficial (debe ser "true")'
        required: false
        default: 'false'
        type: string

# SEGURIDAD POR DEFECTO: Permisos mínimos de solo lectura a nivel de workflow
permissions:
  contents: read

jobs:
  # ============================================================================
  # 0. CONTROL FAIL-CLOSED Y SEGURIDAD PRE-RELEASE (Antes de la compilación)
  # ============================================================================
  pre-flight:
    name: Pre-Flight Gate & Safety Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Enforce fail-closed policy for official mode
        run: |
          set -euo pipefail
          MODE="${{ github.event.inputs.mode || 'validation' }}"
          echo "Selected release workflow mode: ${MODE}"

          # CONTROL FAIL-CLOSED: Si se solicita explícitamente modo 'official' mientras
          # sign-official permanece congelado por Decisión D3, abortar inmediatamente
          # antes de iniciar la compilación en los runners.
          if [ "${MODE}" = "official" ]; then
            echo "================================================================================" >&2
            echo "ERROR: Official release mode ('mode: official') is BLOCKED and FAIL-CLOSED." >&2
            echo "Official signing ('sign-official') is currently disabled (if: false)." >&2
            echo "Preconditions pending before official mode can execute:" >&2
            echo "  1. GitHub Environment 'release' configured with Required Reviewers." >&2
            echo "  2. Authentic Minisign keypair provisioned (replacing PLACEHOLDER)." >&2
            echo "  3. Secrets RELEASE_MINISIGN_SECRET_KEY / RELEASE_MINISIGN_PASSWORD set in Environment." >&2
            echo "  4. Human authorization of AN-076 release initiative." >&2
            echo "" >&2
            echo "No successful execution in mode 'official' is permitted without an authentic signature." >&2
            echo "To validate build and packaging integrity safely, execute with mode: validation." >&2
            echo "================================================================================" >&2
            exit 1
          fi

          echo "✓ Pre-flight safety check passed for mode: ${MODE}"

  # ============================================================================
  # 1. COMPILACIÓN Y EMPAQUETADO MULTIPLATAFORMA (Sin secretos)
  # ============================================================================
  build:
    name: Build & Package (${{ matrix.target }})
    needs: pre-flight
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: wasma
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: wasma.exe
            archive_ext: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: wasma
            archive_ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build CLI release binary
        run: cargo build --release --locked -p wasma-cli --bin wasma --target ${{ matrix.target }}

      - name: Determine release version and provenance
        id: version
        shell: bash
        run: |
          set -euo pipefail
          CARGO_PKG_VER=$(cargo pkgid -p wasma-cli | sed 's/.*@//')
          FULL_COMMIT_SHA="${GITHUB_SHA}"
          SHORT_COMMIT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)

          echo "Cargo wasma-cli package version: ${CARGO_PKG_VER}"
          echo "Source commit full SHA: ${FULL_COMMIT_SHA}"
          echo "Source commit short SHA: ${SHORT_COMMIT_SHA}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            TAG_VER="${TAG#v}"
            if [ "${TAG_VER}" != "${CARGO_PKG_VER}" ]; then
              echo "ERROR: Release tag version '${TAG_VER}' does not match Cargo wasma-cli version '${CARGO_PKG_VER}'" >&2
              exit 1
            fi
            echo "✓ Release tag matches Cargo version (${CARGO_PKG_VER})"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            # Trazabilidad determinista: versión Cargo + commit SHA
            TAG="v${CARGO_PKG_VER}-dev-${SHORT_COMMIT_SHA}"
          fi

          echo "Canonical release tag: ${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "cargo_version=${CARGO_PKG_VER}" >> "$GITHUB_OUTPUT"
          echo "full_sha=${FULL_COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_COMMIT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Install GNU tar (macOS)
        if: runner.os == 'macOS'
        run: brew install gnu-tar

      - name: Validate Binary Architecture & Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          TARGET="${{ matrix.target }}"
          STAGE_DIR="wasma-${TAG}-${TARGET}"
          mkdir -p "${STAGE_DIR}"

          BIN_PATH="target/${TARGET}/release/${{ matrix.binary_name }}"
          test -f "${BIN_PATH}" || { echo "ERROR: Binary not found at ${BIN_PATH}"; exit 1; }

          # Validar arquitectura real para macOS (Apple Silicon arm64)
          if [[ "${TARGET}" == "aarch64-apple-darwin" ]]; then
            file "${BIN_PATH}" | grep -E -i "(arm64|aarch64)" || {
              echo "ERROR: Target declares aarch64-apple-darwin but binary is not arm64" >&2
              file "${BIN_PATH}" >&2
              exit 1
            }
          fi

          # Strip de símbolos sin ignorar fallos silenciosamente
          strip "${BIN_PATH}"

          # Comprobar inclusión estricta de artefactos conforme a ADR-006
          cp "${BIN_PATH}" "${STAGE_DIR}/"
          cp LICENSE README.md "${STAGE_DIR}/"

          # Normalizar permisos y timestamps para reproducibilidad
          chmod 755 "${STAGE_DIR}/${{ matrix.binary_name }}"
          chmod 644 "${STAGE_DIR}/LICENSE" "${STAGE_DIR}/README.md"
          touch -d "2026-01-01 00:00:00 UTC" "${STAGE_DIR}"/* 2>/dev/null || touch -t 202601010000.00 "${STAGE_DIR}"/*

          # Seleccionar binario tar compatible con GNU tar (gtar en macOS via brew, tar en Linux)
          if command -v gtar >/dev/null 2>&1; then
            TAR_BIN="gtar"
          else
            TAR_BIN="tar"
          fi

          ARCHIVE_NAME="${STAGE_DIR}.${{ matrix.archive_ext }}"
          # Empaquetar con orden determinista, timestamp fijo y propietarios neutrales
          ${TAR_BIN} --sort=name --mtime="2026-01-01 00:00:00Z" --owner=0 --group=0 --numeric-owner -czvf "${ARCHIVE_NAME}" -C "${STAGE_DIR}" .
          echo "Created archive: ${ARCHIVE_NAME}"

          # Comprobar que el archivo .tar.gz existe y que su contenido es válido
          if [ ! -f "${ARCHIVE_NAME}" ]; then
            echo "ERROR: Archive ${ARCHIVE_NAME} was not created" >&2
            exit 1
          fi
          echo "Verifying archive contents:"
          ${TAR_BIN} -tvf "${ARCHIVE_NAME}"

          # Eliminar el directorio temporal ${STAGE_DIR} únicamente después de validar el archivo comprimido
          rm -rf "${STAGE_DIR}"

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Tag = "${{ steps.version.outputs.tag }}"
          $Target = "${{ matrix.target }}"
          $StageDir = "wasma-$Tag-$Target"
          New-Item -ItemType Directory -Path $StageDir | Out-Null

          $BinPath = "target\$Target\release\${{ matrix.binary_name }}"
          if (-not (Test-Path $BinPath)) { throw "Binary not found at $BinPath" }

          Copy-Item $BinPath -Destination $StageDir
          Copy-Item LICENSE, README.md -Destination $StageDir

          # Normalizar fechas de modificación para reproducibilidad de metadatos
          Get-ChildItem -Path $StageDir | ForEach-Object {
              $_.CreationTime = "2026-01-01 00:00:00"
              $_.LastWriteTime = "2026-01-01 00:00:00"
          }

          $ArchiveName = "$StageDir.zip"
          Compress-Archive -Path "$StageDir\*" -DestinationPath $ArchiveName
          if (-not (Test-Path -LiteralPath $ArchiveName)) {
              throw "Archive not created at $ArchiveName"
          }
          Write-Host "Created archive: $ArchiveName"
          Remove-Item -LiteralPath $StageDir -Recurse -Force

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: wasma-*.${{ matrix.archive_ext }}
          if-no-files-found: error
          retention-days: 7

  # ============================================================================
  # 2. VALIDACIÓN DE INTEGRIDAD, INVENTARIO Y CATÁLOGO SHA-256 (Sin secretos)
  # ============================================================================
  validate:
    name: Checksums & Package Integrity
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Validate platform release packages
        run: |
          cd dist
          set -euo pipefail
          echo "Validating expected release archives..."

          # 1. Determinar y validar TAG canónico a partir de Git ref y Cargo version
          CARGO_PKG_VER=$(cargo pkgid -p wasma-cli | sed 's/.*@//')
          FULL_COMMIT_SHA="${GITHUB_SHA}"
          SHORT_COMMIT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)

          echo "Cargo wasma-cli package version: ${CARGO_PKG_VER}"
          echo "Source commit full SHA: ${FULL_COMMIT_SHA}"
          echo "Source commit short SHA: ${SHORT_COMMIT_SHA}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            TAG_VER="${TAG#v}"
            if [ "${TAG_VER}" != "${CARGO_PKG_VER}" ]; then
              echo "ERROR: Release tag '${TAG}' does not match wasma-cli Cargo version '${CARGO_PKG_VER}'" >&2
              exit 1
            fi
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${CARGO_PKG_VER}-dev-${SHORT_COMMIT_SHA}"
          fi
          echo "Canonical release tag: ${TAG}"

          # 2. Definir lista exacta de los 3 artefactos canónicos esperados
          EXPECTED_LINUX="wasma-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
          EXPECTED_WINDOWS="wasma-${TAG}-x86_64-pc-windows-msvc.zip"
          EXPECTED_MACOS="wasma-${TAG}-aarch64-apple-darwin.tar.gz"

          # 3. Comprobar que cada uno de los 3 archivos esperados exista estrictamente y sea archivo regular
          for expected in "${EXPECTED_LINUX}" "${EXPECTED_WINDOWS}" "${EXPECTED_MACOS}"; do
            if [ ! -f "${expected}" ]; then
              echo "ERROR: Expected archive '${expected}' not found in dist/" >&2
              exit 1
            fi
            if [ -L "${expected}" ]; then
              echo "ERROR: Expected archive '${expected}' must not be a symlink" >&2
              exit 1
            fi
          done

          # 4. Inspeccionar la totalidad de elementos presentes en dist/ (no solo archivos regulares)
          ALL_ENTRIES=$(ls -1A | LC_ALL=C sort)
          EXPECTED_LIST=$(printf "%s\n%s\n%s\n" "${EXPECTED_MACOS}" "${EXPECTED_LINUX}" "${EXPECTED_WINDOWS}" | LC_ALL=C sort)

          if [ "${ALL_ENTRIES}" != "${EXPECTED_LIST}" ]; then
            echo "ERROR: Directory dist/ inventory mismatch! Found unexpected entries, directories, symlinks or mismatched versions." >&2
            echo "Expected exact files:" >&2
            echo "${EXPECTED_LIST}" >&2
            echo "Found entries in dist/:" >&2
            echo "${ALL_ENTRIES}" >&2
            ls -la >&2
            exit 1
          fi

          # 5. Rechazar explícitamente cualquier elemento que no sea archivo regular (directorios, FIFOs, symlinks)
          for entry in *; do
            if [ -d "${entry}" ]; then
              echo "ERROR: Unexpected directory found in dist/: ${entry}" >&2
              exit 1
            fi
            if [ -L "${entry}" ]; then
              echo "ERROR: Unexpected symlink found in dist/: ${entry}" >&2
              exit 1
            fi
            if [ ! -f "${entry}" ]; then
              echo "ERROR: Entry in dist/ is not a regular file: ${entry}" >&2
              exit 1
            fi
          done

          # 6. Conteo estricto de entradas totales (debe ser exactamente 3)
          TOTAL_ENTRIES=$(ls -1A | wc -l)
          if [ "${TOTAL_ENTRIES}" -ne 3 ]; then
            echo "ERROR: Exactly 3 entries expected in dist/ before manifest generation, found ${TOTAL_ENTRIES}:" >&2
            ls -la >&2
            exit 1
          fi

          echo "✓ Archive inventory matches canonical release artifacts exactly (${TAG}):"
          echo "${ALL_ENTRIES}"

      - name: Generate and sort SHA256SUMS manifest
        run: |
          cd dist
          ls -la
          # Generar catálogo SHA-256 determinista ordenado por nombre de archivo
          sha256sum wasma-* | LC_ALL=C sort -k 2 > SHA256SUMS
          echo "=== SHA256SUMS Catalog ==="
          cat SHA256SUMS

          # Verificar que SHA256SUMS contenga estrictamente 3 entradas correspondientes a los paquetes canónicos
          MANIFEST_COUNT=$(wc -l < SHA256SUMS | tr -d ' ')
          if [ "${MANIFEST_COUNT}" -ne 3 ]; then
            echo "ERROR: SHA256SUMS contains ${MANIFEST_COUNT} entries, expected exactly 3." >&2
            exit 1
          fi

      - name: Verify SHA256 checksums of packaged archives
        run: |
          cd dist
          sha256sum -c SHA256SUMS

      - name: Install Minisign
        run: |
          sudo apt-get update && sudo apt-get install -y minisign

      - name: Execute Minisign Validation (Dry-Run Mode)
        if: ${{ (github.event.inputs.mode || 'validation') != 'official' }}
        run: |
          set -euo pipefail
          cd dist
          echo "=== EXECUTING VALIDATION (DRY-RUN) MODE ==="
          echo "Generating ephemeral test Minisign keypair for end-to-end cryptographic verification..."
          echo "Security note: Official release secrets are isolated and NOT accessible in this step."

          EPHEMERAL_DIR=$(mktemp -d)
          chmod 700 "${EPHEMERAL_DIR}"
          trap 'shred -u "${EPHEMERAL_DIR}/test.key" 2>/dev/null || rm -f "${EPHEMERAL_DIR}/test.key"; rm -rf "${EPHEMERAL_DIR}"' EXIT

          # Generar par de claves efímero de prueba
          minisign -G -p "${EPHEMERAL_DIR}/test-minisign.pub" -s "${EPHEMERAL_DIR}/test.key" -W

          # Firmar catálogo como artefacto de prueba explícito
          minisign -S -s "${EPHEMERAL_DIR}/test.key" -m SHA256SUMS -x SHA256SUMS.test-minisig -t "wasma TEST DRY-RUN signature (NOT FOR OFFICIAL DISTRIBUTION)"

          # Verificar firma con la clave pública de prueba
          minisign -Vm SHA256SUMS -p "${EPHEMERAL_DIR}/test-minisign.pub" -x SHA256SUMS.test-minisig

          # Copiar la clave pública de prueba para auditoría del bundle de validación
          cp "${EPHEMERAL_DIR}/test-minisign.pub" ./test-minisign.pub

          echo "================================================================================"
          echo "✓ DRY-RUN VALIDATION SUCCESSFUL: Packages, SHA256SUMS, and Minisign verified."
          echo "NOTICE: Signature generated with ephemeral test key (SHA256SUMS.test-minisig)."
          echo "NOT FOR OFFICIAL PRODUCTION DISTRIBUTION (Decisión D3 activa)."
          echo "================================================================================"

      - name: Upload validated release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: dist/*
          retention-days: 14

  # ============================================================================
  # 3. FIRMA CRIPTOGRÁFICA OFICIAL (Job independiente protegido por Gate Humano)
  # ============================================================================
  sign-official:
    name: Official Cryptographic Signing (Guarded Gate)
    needs: validate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    # CONDICIONES PREVIAS PARA LA ACTIVACIÓN DE sign-official:
    # 1. Existencia verificada del Environment 'release' en GitHub Repository Settings.
    # 2. Required Reviewers configurados con mantenedores autorizados requeridos.
    # 3. Prevent self-review habilitado cuando exista un segundo mantenedor autorizado.
    # 4. Bypass administrativo deshabilitado para garantizar que ningún admin eluda la revisión.
    # 5. Restricción del Environment exclusivamente a tags 'v*' (refs/tags/v*).
    # 6. Autorización humana independiente mediante revisión formal en GitHub Actions.
    # 7. Provisión de secretos oficiales RELEASE_MINISIGN_SECRET_KEY y RELEASE_MINISIGN_PASSWORD en el Environment.
    #
    # PROTECCIÓN ACTIVA: Deshabilitado mediante 'if: false' hasta cumplir formalmente todas las precondiciones.
    if: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download validated bundle
        uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: dist

      - name: Install Minisign
        run: |
          sudo apt-get update && sudo apt-get install -y minisign

      - name: Verify release invariants & execute official signing
        env:
          INPUT_CONFIRM_PUBLISH: ${{ github.event.inputs.confirm_publish || 'false' }}
          MINISIGN_SECRET_KEY: ${{ secrets.RELEASE_MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.RELEASE_MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          cd dist
          echo "=== EXECUTING OFFICIAL SIGNING MODE ==="

          # 1. Verificar confirm_publish explícito (no meramente declarativo)
          if [ "${INPUT_CONFIRM_PUBLISH}" != "true" ]; then
            echo "ERROR: Official release signing is BLOCKED because confirm_publish is not set to 'true'." >&2
            echo "Official signing requires explicit human intent through workflow_dispatch input confirm_publish: true." >&2
            exit 1
          fi

          # 2. Verificar que se ejecute sobre un tag de release válido
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "ERROR: Official release signing requires a valid release tag matching refs/tags/v* (current: ${GITHUB_REF})." >&2
            exit 1
          fi

          # 3. Trazabilidad de versión y commit SHA
          CARGO_PKG_VER=$(cargo pkgid -p wasma-cli | sed 's/.*@//')
          TAG="${GITHUB_REF#refs/tags/}"
          TAG_VER="${TAG#v}"
          if [ "${TAG_VER}" != "${CARGO_PKG_VER}" ]; then
            echo "ERROR: Official release tag '${TAG}' does not match Cargo wasma-cli version '${CARGO_PKG_VER}'" >&2
            exit 1
          fi
          FULL_COMMIT_SHA="${GITHUB_SHA}"
          SHORT_COMMIT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "✓ Verified tag matches Cargo version (${CARGO_PKG_VER})"
          echo "Provenance: Full commit SHA ${FULL_COMMIT_SHA} (short: ${SHORT_COMMIT_SHA})"

          # 4. Re-verificar inventario y checksums de artefactos validados
          EXPECTED_LINUX="wasma-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
          EXPECTED_WINDOWS="wasma-${TAG}-x86_64-pc-windows-msvc.zip"
          EXPECTED_MACOS="wasma-${TAG}-aarch64-apple-darwin.tar.gz"
          for expected in "${EXPECTED_LINUX}" "${EXPECTED_WINDOWS}" "${EXPECTED_MACOS}"; do
            if [ ! -f "${expected}" ] || [ -L "${expected}" ]; then
              echo "ERROR: Canonical package '${expected}' missing or invalid in validated bundle" >&2
              exit 1
            fi
          done
          sha256sum -c SHA256SUMS

          # 5. Verificar si la clave pública sigue siendo un placeholder (bloqueante)
          if grep -q "PLACEHOLDER" ../knowledge/tech/release-signing-key.pub; then
            echo "ERROR: Official signing is BLOCKED because knowledge/tech/release-signing-key.pub is still a placeholder." >&2
            echo "A human maintainer must provision an authentic Minisign keypair before official mode can proceed." >&2
            exit 1
          fi

          # 6. Verificar que los secretos requeridos existan en el Environment
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "ERROR: Official signing requires RELEASE_MINISIGN_SECRET_KEY secret from 'release' Environment." >&2
            exit 1
          fi

          # 7. Procesar clave en memoria aislada (evitar retención en disco o SSD)
          SECURE_KEY_DIR=$(mktemp -d)
          chmod 700 "${SECURE_KEY_DIR}"
          # Montar tmpfs si está disponible para asegurar retención exclusivamente en RAM
          if sudo mount -t tmpfs -o size=10M,mode=0700 tmpfs "${SECURE_KEY_DIR}" 2>/dev/null; then
            RAM_MOUNTED=true
          else
            RAM_MOUNTED=false
          fi
          trap 'shred -u "${SECURE_KEY_DIR}/minisign.key" 2>/dev/null || rm -f "${SECURE_KEY_DIR}/minisign.key"; if [ "${RAM_MOUNTED}" = "true" ]; then sudo umount "${SECURE_KEY_DIR}" 2>/dev/null || true; fi; rm -rf "${SECURE_KEY_DIR}"' EXIT

          set +x
          echo "${MINISIGN_SECRET_KEY}" > "${SECURE_KEY_DIR}/minisign.key"
          chmod 600 "${SECURE_KEY_DIR}/minisign.key"

          echo "Signing validated SHA256SUMS with official release key..."
          if [ -n "${MINISIGN_PASSWORD:-}" ]; then
            echo "${MINISIGN_PASSWORD}" | minisign -S -s "${SECURE_KEY_DIR}/minisign.key" -m SHA256SUMS -t "wasma release ${{ github.ref_name }}"
          else
            minisign -S -s "${SECURE_KEY_DIR}/minisign.key" -m SHA256SUMS -t "wasma release ${{ github.ref_name }}" -W
          fi

          echo "Verifying official signature against repository public key..."
          minisign -Vm SHA256SUMS -p ../knowledge/tech/release-signing-key.pub
          echo "✓ Official Minisign signature verified successfully!"

          # Limpiar cualquier residuo de prueba antes de empaquetar el bundle oficial
          rm -f SHA256SUMS.test-minisig test-minisign.pub 2>/dev/null || true

      - name: Upload official release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: official-release-bundle
          path: dist/*
          retention-days: 30

  # ============================================================================
  # 4. PUBLICACIÓN FORMAL EN GITHUB RELEASES (Segregada y reservada para AN-076)
  # ============================================================================
  # DISEÑO DE GATE DE PUBLICACIÓN:
  # 1. AN-076 requerirá un gate de publicación independiente del gate de firma,
  #    asegurando que la firma criptográfica y la liberación al público general
  #    constituyan decisiones humanas separadas.
  # 2. La publicación formal permanece congelada hasta decisión humana explícita en AN-076.
  publish:
    name: Publish GitHub Release (Guarded by D3)
    needs: [validate, sign-official]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # PROTECCIÓN D3: La publicación formal permanece congelada hasta decisión humana explícita.
    if: false
    steps:
      - name: Download official bundle
        uses: actions/download-artifact@v4
        with:
          name: official-release-bundle
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: true
          prerelease: false
