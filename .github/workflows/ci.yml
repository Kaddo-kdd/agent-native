name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark-publication:
    name: benchmark publication / offline integrity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify benchmark integrity and publication gates
        run: python -m unittest discover -s scripts -p "test_bench_*.py" -v
      - name: Verify offline publication regeneration
        run: python scripts/bench_publish.py --check

  check:
    name: fmt / clippy / test / build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain (per rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-targets

      - name: Build release
        run: cargo build --workspace --release

      - name: Enforce ADR-002 (runtime does not depend on compiler)
        shell: bash
        run: |
          set -e
          if cargo tree -p agent-native-runtime --prefix none --edges normal 2>/dev/null | grep -i "agent-native-compiler"; then
            echo "ADR-002 violation: runtime depends on compiler" >&2
            exit 1
          fi
          if cargo tree -p agent-native-compiler --prefix none --edges normal 2>/dev/null | grep -i "agent-native-runtime"; then
            echo "ADR-001/002 violation: compiler depends on runtime" >&2
            exit 1
          fi
          echo "ADR-001/002 dependency invariants OK."

  example-aws-lambda:
    name: examples / aws-lambda offline tests (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain (per rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/aws-lambda -> examples/aws-lambda/target

      - name: Verify formatting
        run: cargo fmt --manifest-path examples/aws-lambda/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path examples/aws-lambda/Cargo.toml --all-targets -- -D warnings

      - name: Offline integration tests (11 tests)
        run: cargo test --manifest-path examples/aws-lambda/Cargo.toml

      - name: Verify formatting (native benchmark)
        run: cargo fmt --manifest-path examples/aws-lambda-benchmark/native/Cargo.toml -- --check

      - name: Clippy (native benchmark)
        run: cargo clippy --manifest-path examples/aws-lambda-benchmark/native/Cargo.toml --all-targets -- -D warnings

      - name: Offline integration tests - Native Benchmark (11 tests)
        run: cargo test --manifest-path examples/aws-lambda-benchmark/native/Cargo.toml
